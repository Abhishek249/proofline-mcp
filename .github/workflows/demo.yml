name: Product demo

on:
  workflow_dispatch:
  push:
    paths:
      - "demo/proofline.tape"
      - "scripts/demo_live.py"
      - "src/proofline/**"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Record real MCP interaction
        uses: charmbracelet/vhs-action@v1
        with:
          path: demo/proofline.tape
      - name: Commit generated GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update live Proofline demo"
          file_pattern: assets/proofline-demo.gif
          commit_user_name: proofline-demo-bot
          commit_user_email: actions@github.com
