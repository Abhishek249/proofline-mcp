name: Product demo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/demo.yml"
      - "demo/proofline.tape"
      - "scripts/demo_live.py"
      - "src/proofline/**"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Install recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg ttyd
          go install github.com/charmbracelet/vhs@v0.12.0
      - name: Record real MCP interaction
        run: "$(go env GOPATH)/bin/vhs demo/proofline.tape"
      - name: Verify generated demo
        run: |
          test -s assets/proofline-demo.gif
          file assets/proofline-demo.gif
      - name: Commit generated GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update live Proofline demo"
          file_pattern: assets/proofline-demo.gif
          commit_user_name: proofline-demo-bot
          commit_user_email: actions@github.com
