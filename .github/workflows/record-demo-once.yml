name: Record Proofline demo once

on:
  push:
    paths:
      - ".github/workflows/record-demo-once.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: pip install -e .
      - name: Install recorder
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg ttyd
          go install github.com/charmbracelet/vhs@v0.7.2
      - name: Record real MCP session
        run: |
          "$(go env GOPATH)/bin/vhs" demo/proofline.tape
          test -s assets/proofline-demo.gif
          ffmpeg -y -i assets/proofline-demo.gif -movflags faststart -pix_fmt yuv420p assets/proofline-demo.mp4
          test -s assets/proofline-demo.mp4
          file assets/proofline-demo.gif assets/proofline-demo.mp4
      - name: Commit media
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: add Proofline live product demo"
          file_pattern: assets/proofline-demo.gif assets/proofline-demo.mp4
          commit_user_name: proofline-demo-bot
          commit_user_email: actions@github.com
